<div class="ms-auto">
  <ul class="list-unstyled">
    <li>
      <div class="dropdown pc-h-item header-user-profile" ngbDropdown>
        <a
          class="pc-head-link head-link-primary dropdown-toggle arrow-none me-0"
          data-bs-toggle="dropdown"
          href="javascript:"
          ngbDropdownToggle
        >
          <img src="assets/images/logos/logo.png" alt="user-image" class="user-avtar" />
          <span>
            <i class="ti ti-settings"></i>
          </span>
        </a>
        <div class="dropdown-menu dropdown-user-profile dropdown-menu-end pc-h-dropdown" ngbDropdownMenu>
          <div class="dropdown-header">
            <ng-scrollbar style="height: 150px" visibility="hover">
              <a class="dropdown-item">
                <i class="ti ti-settings"></i>
                <span>Xin chào Admin</span>
              </a> 
              <hr/>
              <a (click)="onLogout()" class="dropdown-item">
                <i class="ti ti-logout"></i>
                <span>Đăng xuất</span>
              </a>
              <hr/>
            </ng-scrollbar>
          </div>
        </div>
      </div>
    </li>
  </ul>
</div>
