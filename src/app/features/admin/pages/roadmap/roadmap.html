<!-- Main Content -->
<div class="main-content">
    <!-- Top Bar -->
    <div class="top-bar">
        <h1 class="page-title" style="margin-left: 100px;">Danh sách các lộ trình</h1>

    </div>

    <!-- Content Area -->
    <div class="content-area">
        <div class="course-grid">
            @for(roadMap of roadMaps; track roadMap.id) {
            <div class="course-card" (click)="onSelectRoadMap(roadMap.name!)">
                <div class="course-number">{{ roadMap.name }}</div>
            </div>
            }
        </div>
    </div>
</div>
